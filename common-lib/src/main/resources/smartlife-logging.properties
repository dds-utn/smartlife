# =============================================================================
# smartlife-logging.properties — Configuración del SDK de Logging Centralizado
# =============================================================================
# Coloca una copia de este archivo en src/main/resources de tu servicio para
# sobreescribir cualquiera de estos valores sin modificar el SDK.
#
# Para apuntar a un archivo en una ruta arbitraria (útil en tests):
#   -Dsmartlife.logging.config=ruta/al/archivo.properties
# =============================================================================

# Nombre del servicio que aparecerá en cada registro de error.
logging.service.name=smartlife-service

# Destinos de logging separados por coma.
# Valores válidos: console, file, database
# Ejemplo con múltiples destinos: logging.destinations=console,file
logging.destinations=console

# --- Destino: archivo ---
# Ruta del archivo donde se persisten los errores.
# El archivo se crea si no existe; los registros se acumulan (append).
# logging.file.path=/var/log/smartlife/errors.log

# --- Destino: base de datos ---
# Motor de base de datos a utilizar.
# Valores válidos: mongodb, mysql
# logging.db.engine=mysql

# Configuración MongoDB
mongodb.connectionString=mongodb://localhost:27017
mongodb.databaseName=smartlife_logs

# Configuración MySQL
mysql.url=jdbc:mysql://localhost:3306/smartlife_logs
mysql.username=smartlife
mysql.password=changeme

# --- Extensibilidad: estrategias adicionales ---
# Lista separada por comas de clases que implementan ErrorLoggingStrategy.
# Se cargan en tiempo de ejecución mediante reflexión.
# logging.strategy.extraClasses=com.ejemplo.MiEstrategia,com.ejemplo.OtraEstrategia
