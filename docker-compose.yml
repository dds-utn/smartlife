services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smartlife-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartlife

  sales-service:
    build:
      context: .
      dockerfile: sales-service/Dockerfile
      args:
        SERVICE_NAME: sales-service
    container_name: smartlife-sales-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8082"
    networks:
      - smartlife

  trends-service:
    build:
      context: .
      dockerfile: trends-service/Dockerfile
      args:
        SERVICE_NAME: trends-service
    container_name: smartlife-trends-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8083:8083"
    networks:
      - smartlife

  security-service:
    build:
      context: .
      dockerfile: security-service/Dockerfile
      args:
        SERVICE_NAME: security-service
    container_name: smartlife-security-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8084:8084"
    networks:
      - smartlife

  security-service-in-home:
    build:
      context: .
      dockerfile: security-service-in-home/Dockerfile
      args:
        SERVICE_NAME: security-service-in-home
    container_name: smartlife-security-service-in-home
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SMARTLIFE_HOGAR_ID: "1"
    ports:
      - "8085:8085"
    networks:
      - smartlife

networks:
  smartlife:
    driver: bridge
